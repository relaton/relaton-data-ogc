abstract:
- language: en
  script: Latn
  content: The OGC Catalog-Web Profile is a complex specification that implies usage
    of many concepts, such as ressources, metadata, registry, registry information
    model, harvesting, etc. This document is a user-friendly introduction to these
    concepts. It will help the understanding of the Catalog specification in general
    and of the Catalog Web profile with ebRIM in particular.
