abstract:
- content: "GeoJSON is a very popular exchange format for feature data. GeoJSON is
    widely supported, including in most implementations of the OGC API - Features
    - Part 1: Core Standard. However, GeoJSON has intentional restrictions that prevent
    or limit its use in certain geospatial application contexts. For example, GeoJSON
    is restricted to using only WGS 84 coordinates in Longitude Latitude axis order,
    supports only the original Simple Features geometry types, and has no concept
    of classifying features according to their type.\r\n\r\nThe OGC Features and Geometries
    JSON (JSON-FG) Standard specifies GeoJSON extensions that provide standard ways
    to support these and other additional requirements. The JSON-FG Standardization
    goal is to focus on capabilities that may require some geospatial expertise, but
    that are useful in many applications. Edge cases are considered out-of-scope of
    JSON-FG.\r\n\r\nSince JSON-FG specifies extensions to the GeoJSON RFC that still
    conform to the GeoJSON rules, valid JSON-FG features or feature collections are
    also valid GeoJSON features or feature collections."
