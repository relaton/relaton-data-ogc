abstract:
- language: en
  script: Latn
  content: "Taiwan is prone to typhoons and debris flow disasters. The average annual rainfall is more than 2.5 meters, which is three times the world average rainfall. One notable case was typhoon Morakot which happened in 2009. The rainfall reached 2.5 meters after 80 hours. That’s the average yearly rainfall on the island. During that typhoon, 9,100 people were evacuated. 1,046 escaped from the possible casualties. Unfortunately 673 people could not be saved and passed away. If people want to prevent this kind of event, residents who live near the hazard areas such as potential debris flow torrents need to communicate warnings and evacuation orders sooner and more efficiently. That’s where early response and evacuation under limited bandwidth comes in to play.\r\n\r\nThis user guide provides guidance for using IoT technologies and OGC SensorThings API to build an early warning mechanism with various systems. It also provides guidance for using Routing API to build an evacuation application under limited bandwidth. These scenarios were stated as the following use cases."
