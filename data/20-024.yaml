abstract:
- language: en
  script: Latn
  content: "The OGC API — Common Standard is a multi-part standard which defines a set of documents whose requirements classes can be used to build resource and purpose-specific Web API specifications. This document, OGC API — Common — Part 2: Geospatial Data Standard (Common API-2: GeoData) is one of those parts. This part specifies how to list and describe available collections of geospatial data within a Web API deployment.\r\n\r\nThe OGC Standards baseline has been extended to include Resource Oriented Architectures and Web APIs. In the course of developing OGC Web API standards, some practices proved to be common across multiple OGC Web API standards. These common requirements classes are documented in the OGC API — Common Multi-Part Standard, and serve as reusable components. Standards developers can specify dependencies on these requirements classes in the construction of OGC Web API Standards, and implementors of Web APIs can also indicate conformance to these requirements classes directly. The result is a modular suite of coherent API standards which can be adapted by a system designer for the unique requirements of their system."
