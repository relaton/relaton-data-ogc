abstract:
- language: en
  script: Latn
  content: "Interoperability and open architectures are core requirements for state
    of the art\r\nimplementations of IT solutions. Service oriented architectures
    based on a commitment to\r\nusing open standards enables a system of componentised
    building blocks which can be\r\nchosen, run and maintained according to their
    best match of user requirements,\r\nindependent of vendor solutions or storage
    models. Such a commitment also ensures that\r\nrelevant interface specifications
    and standards are adhered to. Since this approach is\r\nflexible and can easily
    adapt to changing requirements, operational costs are reduced and\r\nprovides
    higher efficiency levels of the systems and greatly reduces the risk of future\r\ninvestment
    losses. To define what interoperability and open architectures are about and\r\nwhich
    processes and procedures are parts of the definition process, we will take a look
    at\r\nthe work of the Open Geospatial Consortium. "
