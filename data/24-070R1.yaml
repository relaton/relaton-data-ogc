abstract:
- language: en
  script: Latn
  content: "This document specifies the LAZ 1.4 standard. An open source implementation
    of the standard is\r\nprovided in the LASzip library at https://github.com/LASzip/LASzip.
    The relevant version of the\r\nLASzip library is Release 3.4.3, released on November
    11, 2019, and Release 3.4.4, released on\r\nApril 17, 2024, which are identical
    in terms of specification.\r\nLAZ 1.4 is based on the LAS 1.4 format, and only
    the LAZ 1.4 format using the LAS 1.4 format is\r\nspecified."
