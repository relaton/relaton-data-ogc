abstract:
- language: en
  script: Latn
  content: This document reflects the current state of an ongoing conversation on
    interoperability and AI-readiness among OGC members and partners. It draws on
    work that OGC has carried out with its members across pilots and testbeds, and
    in EU-funded research projects, and on the wider debate about the future of spatial
    data infrastructures and geospatial ecosystems. It is offered as a proposal and
    a basis for discussion, a shared and evolving reference rather than a normative
    position or the view of any single organization.
