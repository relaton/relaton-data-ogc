abstract:
- language: en
  script: Latn
  content: "The OSPD 2025 Building Blocks Report provides an overview of how specification
    artefacts can be used to support open and reproducible scientific workflows. Rather
    than focusing on individual platform implementations, the report abstracts common
    specification patterns observed across multiple platforms, capturing reusable
    concepts such as workflow intent, execution packaging, configuration parameters,
    and execution environments.\r\n\r\nBy applying a modular, schema-driven approach,
    the Building Blocks enable workflows to be described once and reused across multiple
    platforms. This approach supports transparency, improves comparability between
    workflows, and reduces the effort required to share scientific methods.\r\n\r\nThe
    report consolidates the current state of these Building Blocks as developed within
    OSPD 2025 and documents their scope, relationships, and validation status.\r\n\r\n"
