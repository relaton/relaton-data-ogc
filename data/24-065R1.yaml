abstract:
- language: en
  script: Latn
  content: "This Open Geospatial Consortium (OGC) member developed and approved document,
    referred to as the ModSpec: Part 2 - UML, defines an optional ModSpec requirements
    class for UML.\r\n\r\nThe ModSpec: Core Standard defines a model and related requirements
    and recommendations for writing and structuring modular standards documents. Further,
    this model is designed to enable consistent and verifiable testing of implementations
    of a standard that claim conformance. The ModSpec is a meta-standard: A standard
    specifying requirements for crafting and documenting modular and testable standards.\r\n\r\nThe
    goals of using the ModSpec are:\r\n\r\nTo define characteristics and a structure
    for the development of modular standards which will minimize the difficulty in
    writing testable standards while maximizing usability and interoperability; and\r\nTo
    ensure that a standard specifies requirements in a common and consistent manner
    and that these requirements are testable."
