abstract:
- language: en
  script: Latn
  content: "The OGC API-Environmental Data Retrieval (EDR) Standard provides a family
    of lightweight query interfaces to access spatiotemporal data resources by requesting
    data at a Position, within a Radius, Area or Cube, along a Trajectory or through
    a Corridor, from a predefined Location or as an existing data Item. A spatiotemporal
    data resource is a collection of spatiotemporal data that can be sampled using
    the EDR query pattern geometries. These patterns are described in the section
    describing the Core Requirements Class.\r\n\r\nThe goals of the EDR Application
    Programming Interface (API), often abbreviated to EDR API, that is specified by
    this Standard are to:\r\n\r\nMake it easier to access a wide range of data through
    a uniform, well-defined simple Web interface;\r\n\r\nTo achieve data reduction
    to just the data needed by the user or client while hiding much of the data storage
    complexity.\r\n\r\n"
