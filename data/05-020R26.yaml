abstract:
- language: en
  script: Latn
  content: "The OGC provides a collaborative, consensus process for developing and
    approving open, international standards for the geospatial domain. “International
    standards”[1] are those adopted by an international standardizing/standards organization
    and made available to the public. Specifically, an OGC standard is:\r\n\r\nA document,
    established by consensus and approved by the OGC Membership, that provides, for
    common and repeated use, rules, guidelines or characteristics for activities or
    their results, aimed at the achievement of the optimum degree of order in a given
    context.\r\n\r\nTo guide an open standards development and approval process, a
    member approved Policies and Procedures is required.\r\n\r\nThis document describes
    the OGC Technical Committee (TC) policies and procedures (P&P). The TC has been
    granted authority to operate by the OGC Bylaws. The TC is composed of individuals
    representing organizations that are duly recognized members in good standing of
    the OGC. The Technical Committee Chair (TCC - see Role of the Technical Committee
    Chair (TCC)) facilitates the TC process.\r\n\r\n"
