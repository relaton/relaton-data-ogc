abstract:
- language: en
  script: Latn
  content: This Report documents outcomes from OGC Testbed‑21 focused on ontologies
    for coverage description, with an emphasis on imagery and video. The work responds
    to a growing need for metadata models that support discovery, understanding, and
    integration of coverage data across heterogeneous systems, while aligning with
    both existing OGC geospatial standards and sponsor requirements for ontology‑based
    approaches.
