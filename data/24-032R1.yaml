abstract:
- language: en
  script: Latn
  content: "The SensorThings API Extension: WebSub Asynchronous Messaging Standard
    (STA-WebSub) introduces an additional capability to the SensorThings API v1.1,
    allowing users to subscribe to a compliant SensorThings API endpoint using a request
    URL. This enables users to receive notifications when the outcome of a query changes,
    typically due to the arrival of new data. STA-WebSub is built upon the W3C WebSub
    Recommendation.\r\n\r\nSpecifically, the STA-WebSub Standard outlines how to determine
    if a request URL is suitable for subscription, how to initiate subscriptions using
    the URL, and how notifications will be delivered. This Standard mandates that
    a consumer implements an HTTP(S) Webhook to receive notifications from the STA-WebSub
    Hub(s) associated to a SensorThings API instance.\r\n\r\nImplementing STA-WebSub
    enhances the versatility of SensorThings API services in creating asynchronous
    workflows over the HTTP protocol. The ability to establish trigger conditions
    and specify the structure of event data pushed to a Webhook via HTTP(S) POST allows
    for tailored event processing within workflows. For instance, when used alongside
    a STA-WebSub Subscriber that supports WebSockets, this Standard enables web applications
    running in modern web browsers to subscribe to and receive notifications (such
    as observations or other data) for seamless visualization, without the need for
    browser extensions. In an air quality example, a JavaScript application could
    alert the subscribed population about abnormal pollutant levels in real time on
    their mobile devices. In the weather sector, a process could be triggered that
    recalculates a weather forecast whenever sufficient new data is received through
    a subscription.\r\n\r\nSTA-WebSub provides two significant advantages. Firstly,
    subscribers can retrieve data from a SensorThings API service and then use the
    same URL to subscribe for updates. This approach eliminates the necessity for
    subscribers to poll the SensorThings API service. Instead, all updates tied to
    the specified URL are sent to the subscriber’s Webhook when an update event occurs.
    Secondly, the MQTT protocol used by the SensorThings API does not need to be exposed
    to third parties for receiving updates. With STA-WebSub, the MQTT protocol can
    be kept internal between the SensorThings API service and the associated STA-WebSub
    Hub(s), enhancing security and performance management of the MQTT broker.\r\n\r\nA
    compliant STA-WebSub Hub implementation must be capable to convert a subscription
    URL into an MQTT topic, subscribe to the MQTT broker associated with the SensorThings
    API service, and receive MQTT notifications to distribute them to the STA-WebSub
    Subscribers’ Webhooks.\r\n\r\nTo fully leverage STA-WebSub’s capabilities, a SensorThings
    API service needs to support the MQTT topic pattern to include $filter and $expand
    functionalities through Open Data Protocol (OData) query parameters. The $filter
    parameter supports subscriptions based on defined triggering conditions, while
    the use of $select and $expand allows subscribers to receive precisely the required
    data and structure. This feature can be described as ‘receiving fit-for-purpose
    updates’.\r\n\r\nTo manage subscriptions according to business or governance policies,
    authentication and access control can be integrated into the STA-WebSub discovery
    process. For scalability and optimal processing of various notification types
    (updates), a single SensorThings API service may provide multiple STA-WebSub Hubs
    tailored to different types of updates or business requirements. The assignment
    of a specific STA-WebSub Hub to a subscriber may depend on the subscription URL
    and existing business policies.\r\n\r\nBuilding trust in the received updates
    can be achieved through the W3C WebSub’s HMAC option, which offers subscribers
    a method to verify that the content distributed from a Hub is authentic and has
    not been altered.\r\n\r\n"
