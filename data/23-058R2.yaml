abstract:
- language: en
  script: Latn
  content: "This document (Schemas) specifies how geospatial data such as features
    can be described by a logical schema and how such schemas are published in an
    OGC Web API implementation. The document is published both as Part 5 of OGC API
    - Features and as Part 3 of OGC API - Common.\r\n\r\nThis Standard specifies provisions
    for schemas that are applicable to any type of geospatial data as well as provisions
    for profiles. While the provision originate from use cases involving feature data,
    all provisions are not specific to features."
